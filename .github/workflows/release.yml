# Release: push a tag like v0.2.0 (after bumping every packages/*/package.json
# to the same version). Builds, tests, publishes the four packages to npm with
# provenance — only when the NPM_TOKEN secret exists — and creates the GitHub
# release with generated notes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - name: Packed packages work for a consumer
        run: node scripts/smoke-packages.mjs
      - name: End-to-end
        run: npx playwright install --with-deps chromium && npm run test:e2e

      - name: Versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in core view server vite; do
            V=$(node -p "require('./packages/$p/package.json').version")
            if [ "$V" != "$TAG" ]; then echo "packages/$p is $V, tag is $TAG"; exit 1; fi
          done

      - name: Publish to npm (core first — the others depend on it)
        if: env.HAS_NPM_TOKEN == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in core view server vite; do
            npm publish -w @vue-mcp-apps/$p --provenance --access public
          done

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The CHANGELOG section of this version first, then GitHub's list of merged PRs.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ "$HAS_NPM_TOKEN" != "true" ]; then
            printf '\n> Not on npm yet: install from this repository (see the README, "Install").\n' >> notes.md
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
