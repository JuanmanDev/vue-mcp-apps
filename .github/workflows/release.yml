# Release: push a tag like v0.2.0 (after bumping every packages/*/package.json
# to the same version). Builds and tests, publishes the four packages to npm
# through trusted publishing (OIDC, no token, provenance attached), then creates
# the GitHub release with generated notes.
#
# Publishing runs in the `npm` environment, which only accepts `v*` tags; each
# package on npmjs.com trusts exactly this file + that environment. Re-running
# is safe: versions already on npm and an existing GitHub release are skipped.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - name: Packed packages work for a consumer
        run: node scripts/smoke-packages.mjs
      - name: End-to-end
        run: npx playwright install --with-deps chromium && npm run test:e2e

      - name: Versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in core view server vite; do
            V=$(node -p "require('./packages/$p/package.json').version")
            if [ "$V" != "$TAG" ]; then echo "packages/$p is $V, tag is $TAG"; exit 1; fi
          done

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build:packages

      - name: Publish to npm (core first — the others depend on it)
        run: |
          for p in core view server vite; do
            V=$(node -p "require('./packages/$p/package.json').version")
            if npm view "@vue-mcp-apps/$p@$V" version >/dev/null 2>&1; then
              echo "@vue-mcp-apps/$p@$V is already on npm, skipping"
              continue
            fi
            npm publish -w @vue-mcp-apps/$p --provenance --access public
          done

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it as is"
            exit 0
          fi
          # The CHANGELOG section of this version first, then GitHub's list of merged PRs.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
