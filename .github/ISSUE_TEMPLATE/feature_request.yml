name: Feature request
description: An idea for the packages, the playground, the AI demo or the docs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API sketch, UI idea, or behaviour. Mention how it keeps the invariants (actions as data, plain payloads, templates fetch nothing).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
